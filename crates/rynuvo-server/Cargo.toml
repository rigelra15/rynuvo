[package]
name = "rynuvo-server"
edition.workspace = true
version.workspace = true

[features]
test-util = ["dep:tempfile", "dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
rynuvo-proto = { path = "../rynuvo-proto" }
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
imagesize = "0.14"
fs4 = "0.13"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = { version = "3", optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
rynuvo-server = { path = ".", features = ["test-util"] }
