# Builds the desktop installers and the server binary, then publishes them as a GitHub Release.
# Tag pushes normally release. A one-off v0.8.3 marker also releases on merge to main,
# avoiding an extra manual tag operation; no general release-on-every-main-push.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/releases/v0.8.3.once
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
            out: mac.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            out: windows-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches saved by a tag run can only be read by that same tag, so releases never reused them.
      # main keeps them warm instead (warm-cache.yml) and every run here restores from main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Windows Defender scans every file the compiler writes; off for this throwaway runner.
      - name: Faster disk on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "${GITHUB_REF_NAME}" = "v${{ steps.v.outputs.version }}" ] || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${{ steps.v.outputs.version }}"; exit 1; }

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Tauri's own APPLE_CERTIFICATE import only accepts trusted (Apple-issued) identities, so the
      # self-signed certificate goes into a keychain here and Tauri gets just its name.
      - name: Import Mac signing certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kp=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"

      - name: Build
        working-directory: apps/desktop
        env:
          # Signs the updater bundles (the key has no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS: one fixed self-signed certificate, so every version is the same app to macOS and
          # Screen Recording / Microphone permissions survive updates (ad-hoc signing loses them).
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Mac app is signed with the Rynuvo certificate
        if: matrix.os == 'macos-latest'
        run: |
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app)
          codesign -d -r- "$app" 2>&1 | tee /dev/stderr | grep -q 'certificate root' || {
            echo "::error::$app is not signed with the certificate (permissions would reset on update)"; exit 1; }

      - name: Collect installer and updater bundle
        run: |
          mkdir -p out
          b=target/${{ matrix.target }}/release/bundle
          name="Rynuvo-${{ steps.v.outputs.version }}"
          if [ "${{ matrix.os }}" = macos-latest ]; then
            cp "$(ls $b/dmg/*.dmg | head -1)" "out/$name-mac.dmg"
            cp $b/macos/*.app.tar.gz "out/$name-mac.app.tar.gz"
            cp $b/macos/*.app.tar.gz.sig "out/$name-mac.app.tar.gz.sig"
          else
            src=$(ls $b/nsis/*-setup.exe | head -1)
            cp "$src" "out/$name-windows-setup.exe"
            cp "$src.sig" "out/$name-windows-setup.exe.sig"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  android:
    # The phone build: one signed arm64 APK, plus its updater signature (the app checks the APK
    # against the same key as desktop updates before handing it to Android's installer).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/desktop/src-tauri/gen/android/**/*.gradle*

      # The runner image already carries the Android SDK (ANDROID_HOME) and its sdkmanager.
      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13599879"
          nd="$ANDROID_HOME/ndk/29.0.13599879"
          { echo "NDK_HOME=$nd"; echo "ANDROID_NDK=$nd"; echo "ANDROID_NDK_ROOT=$nd"; } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # The same release key every time, or phones refuse the APK as an update.
      - name: Release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: apps/desktop
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect APK and its updater signature
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          mkdir -p ../../out
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk | head -1)
          out="../../out/Rynuvo-${{ steps.v.outputs.version }}-android.apk"
          cp "$apk" "$out"
          "$ANDROID_HOME"/build-tools/*/apksigner verify "$out" || true
          pnpm tauri signer sign "$out"
          ls -lh ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: out/*
          if-no-files-found: error

  server:
    # ubuntu-24.04 ships glibc 2.39, the same floor the VPS build targets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p rynuvo-server
      - name: Collect binary
        run: |
          mkdir -p out
          cp target/release/rynuvo-server out/rynuvo-server-linux-x86_64
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [desktop, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          # On the one-off main push, gh creates the tag at this checked-out build commit.
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag="v0.8.3"; fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Rynuvo $tag" --generate-notes
