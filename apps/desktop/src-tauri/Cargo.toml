[package]
name = "rynuvo-desktop"
version.workspace = true
description = "Rynuvo desktop client"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rynuvo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
rynuvo-proto = { path = "../../../crates/rynuvo-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Named directly to pick its crypto: the updater brings ring and reqwest brings aws-lc, and with both
# rustls won't guess, so the app installs aws-lc at start.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
getrandom = "0.3"
base64 = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
webp = "0.3"
opus = "0.4"
cpal = "0.18"
sonora = "0.3"
nnnoiseless = "0.5"
ringbuf = "0.6.0"
openh264 = "0.9"
# Captions: speech to text on the device itself (whisper.cpp), so call audio never leaves it.
whisper-rs = "0.16"
tauri-plugin-process = "2"

# Desktop only: tray, global shortcuts, start at login and self-update don't exist on Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# The OS keychain (Keychain on macOS/iOS, Credential Manager on Windows); Android has no backend.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# iOS: the call's audio session (play and record), so the mic has input channels.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

# Android: reqwest's platform verifier needs JNI setup; check against Mozilla's roots instead.
# minisign-verify checks a downloaded update APK against the same key the desktop updater uses.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
minisign-verify = "0.2"

[dev-dependencies]
rynuvo-server = { path = "../../../crates/rynuvo-server", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError", "NSDictionary"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound"] }
videotoolbox = "0.21"
screencapturekit = { version = "11", features = ["macos_14_0"] }
apple-cf = "0.11"

[target."cfg(windows)".dependencies]
wasapi = "0.27"
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
