[package]
name = "rynuvo-desktop"
version.workspace = true
description = "Rynuvo desktop client"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rynuvo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5" }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
rynuvo-proto = { path = "../../../crates/rynuvo-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
getrandom = "0.3"
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
rynuvo-server = { path = "../../../crates/rynuvo-server", features = ["test-util"] }
