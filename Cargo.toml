[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.10.1"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image decode/resize/encode is unusably slow unoptimized; keep debug builds responsive.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.webp]
opt-level = 3
# Audio DSP must run faster than real time even in debug builds.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3
# Captions: whisper.cpp built for debug (its CMake follows this) is far too slow to keep up.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# macOS 27 beta's `strip` corrupts large proc-macro dylibs (sqlx-macros: "mis-aligned LINKEDIT
# string pool"), and release builds strip debuginfo by default. Don't strip build-time artifacts.
[profile.release.build-override]
strip = false

# The QR scanner with a camera fix for some Samsung phones (see the "Rynuvo patch" notes inside).
[patch.crates-io]
tauri-plugin-barcode-scanner = { path = "apps/desktop/src-tauri/vendor/tauri-plugin-barcode-scanner" }
